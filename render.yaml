services:
  - type: web
    name: boss-discord-ai-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_TEXT_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_VISION_MODEL
        value: openai/gpt-oss-120b
      - key: DISCORD_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
